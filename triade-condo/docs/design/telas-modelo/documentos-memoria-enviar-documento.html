er; gap: 8px; color: #1e1531"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Laudo e certificado</span><span style="margin-left: auto; color: #5e5475; display: inline-flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></span></div></label><label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 13px; font-weight: 500">Vale até</span><div style="border: 1px solid #9184aa; background: #fdfcff; border-radius: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; font: 400 15px Manrope, sans-serif; color: #1e1531; display: flex; align-items: center; gap: 8px; color: #5e5475"><span style="color: #5e5475; display: inline-flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1 -3 3h-11a3 3 0 0 1 -3 -3v-9.5a3 3 0 0 1 3 -3zM3.5 10h17M8 3v4M16 3v4"></path></svg></span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">dd/mm/aaaa</span></div><span style="font-size: 13px; color: #5e5475">Do laudo. Sem data, o item fica em dia sem aviso.</span></label><label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 13px; font-weight: 500">Quem vê</span><div style="border: 1px solid #9184aa; background: #fdfcff; border-radius: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; font: 400 15px Manrope, sans-serif; color: #1e1531; display: flex; align-items: center; gap: 8px; color: #1e1531"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Só quem cuida do condomínio</span><span style="margin-le
