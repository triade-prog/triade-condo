# CI do sistema da TRÍADE Condo (triade-condo/sistema/), passo 0 (F0.9, PT-18):
# Qualidade (lint, tipos, Vitest, Deno) · Banco (pgTAP no PostgreSQL 17, o mesmo do Supabase)
# · Ponta a ponta (Playwright + axe no celular e no computador) · Varredura de segredos.
name: CI

on:
  push:
    paths: ["triade-condo/sistema/**", ".github/workflows/ci.yml", ".gitleaks.toml"]
  pull_request:
    paths: ["triade-condo/sistema/**", ".github/workflows/ci.yml", ".gitleaks.toml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: triade-condo/sistema

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pnpm (versão do package.json, via corepack)
        run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Edge Functions no Deno (tipos, lint, testes)
        run: pnpm test:deno
      - name: Dependências sem vulnerabilidade alta
        run: pnpm audit --prod --audit-level high

  banco:
    name: Banco (pgTAP e edição simultânea)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 com pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-17 postgresql-17-pgtap libtap-parser-sourcehandler-pgtap-perl
      - run: PGBIN=/usr/lib/postgresql/17/bin bash scripts/test-db.sh

  ponta-a-ponta:
    name: Ponta a ponta (celular e computador)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pnpm (versão do package.json, via corepack)
        run: corepack enable && corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: |
            triade-condo/sistema/playwright-report
            triade-condo/sistema/test-results
          retention-days: 7

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose --config /repo/.gitleaks.toml
